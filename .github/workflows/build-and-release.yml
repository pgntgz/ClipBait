name: Build and Release

on:
  push:
    tags:
      - '*'
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  build:
    name: Build APK & Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build APK (Clean Cloud Build)
        run: ./gradlew assembleRelease --stacktrace --info

      - name: Prepare APK Asset & Compute SHA-256
        id: prepare_asset
        run: |
          TAG_NAME="${{ github.ref_name }}"
          if [ -z "$TAG_NAME" ] || [ "${{ github.ref_type }}" != "tag" ]; then
            TAG_NAME="latest"
          fi
          mkdir -p dist
          APK_FILE="dist/ClipBait-${TAG_NAME}.apk"
          cp app/build/outputs/apk/release/app-release.apk "$APK_FILE"
          SHA256_HASH=$(sha256sum "$APK_FILE" | awk '{print $1}')
          echo "$SHA256_HASH  ClipBait-${TAG_NAME}.apk" > "${APK_FILE}.sha256"
          echo "apk_path=$APK_FILE" >> $GITHUB_OUTPUT
          echo "sha_path=${APK_FILE}.sha256" >> $GITHUB_OUTPUT
          echo "apk_name=ClipBait-${TAG_NAME}.apk" >> $GITHUB_OUTPUT
          echo "apk_sha256=$SHA256_HASH" >> $GITHUB_OUTPUT

      - name: Generate GitHub SLSA Build Provenance Attestation
        uses: actions/attest-build-provenance@v2
        continue-on-error: true
        with:
          subject-path: ${{ steps.prepare_asset.outputs.apk_path }}

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.prepare_asset.outputs.apk_name }}
          path: |
            ${{ steps.prepare_asset.outputs.apk_path }}
            ${{ steps.prepare_asset.outputs.sha_path }}
          if-no-files-found: error

      - name: Create GitHub Release with Provenance Links
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: ClipBait ${{ github.ref_name }}
          files: |
            ${{ steps.prepare_asset.outputs.apk_path }}
            ${{ steps.prepare_asset.outputs.sha_path }}
          draft: false
          prerelease: false
          generate_release_notes: true
          body: |
            ### 构建信息
            - **构建日志**：https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
            - **源码提交**：https://github.com/${{ github.repository }}/commit/${{ github.sha }}
            - **数字签名**：https://github.com/${{ github.repository }}/attestations
            - **SHA-256**：`${{ steps.prepare_asset.outputs.apk_sha256 }}`
